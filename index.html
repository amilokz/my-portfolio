<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Primary Meta Tags -->
    <title>Komil Hassan | Full Stack Developer Portfolio</title>
    <meta name="title" content="Komil Hassan | Full Stack Developer Portfolio" />
    <meta name="description" content="Full Stack Developer specializing in React, Laravel, PHP, and modern web technologies. View my portfolio of projects and get in touch for collaboration." />
    <meta name="keywords" content="Full Stack Developer, React Developer, Laravel Developer, PHP Developer, Web Developer, Komil Hassan, Portfolio" />
    <meta name="author" content="Komil Hassan" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://amilokz.github.io/my-portfolio/" />
    <meta property="og:title" content="Komil Hassan | Full Stack Developer" />
    <meta property="og:description" content="Full Stack Developer specializing in React, Laravel, and modern web technologies. Check out my work!" />
    <meta property="og:image" content="https://amilokz.github.io/my-portfolio/og-image.jpg" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://amilokz.github.io/my-portfolio/" />
    <meta property="twitter:title" content="Komil Hassan | Full Stack Developer" />
    <meta property="twitter:description" content="Full Stack Developer specializing in React, Laravel, and modern web technologies." />
    <meta property="twitter:image" content="https://amilokz.github.io/my-portfolio/og-image.jpg" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://amilokz.github.io/my-portfolio/" />
    
    <!-- Favicon - Fixed -->
    <link rel="icon" type="image/svg+xml" href="/my-portfolio/vite.svg" />
    <link rel="apple-touch-icon" href="/my-portfolio/vite.svg" />
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    
    <!-- Google Fonts - Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/my-portfolio/manifest.json" />
    <meta name="theme-color" content="#00cfff" />
    
    <!-- Mobile Web App (Fixed deprecated warning) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KH Portfolio" />
    
    <!-- Dark/Light mode detection -->
    <script>
      (function() {
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.classList.add(savedTheme);
        document.documentElement.setAttribute('data-theme', savedTheme);
        
        // Set body background
        if (savedTheme === 'dark') {
          document.body.style.backgroundColor = '#0a0a0a';
        } else {
          document.body.style.backgroundColor = '#f5f5f5';
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- GitHub Pages SPA fallback script -->
    <script>
      (function() {
        const path = window.location.pathname;
        if (path.includes('/casestudy/') || (path !== '/' && path !== '/my-portfolio/' && !path.includes('.'))) {
          window.location.href = '/my-portfolio/#' + path.replace('/my-portfolio', '');
        }
      })();
    </script>
  </body>
</html>
